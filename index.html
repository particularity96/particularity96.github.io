":"Musical","inLanguage":"de","url":"https://nicschilling.de/musical","composer":{"@id":"https://nicschilling.de/#person"},"lyricist":{"@id":"https://nicschilling.de/#person"},"description":"Eine Gruppe Jugendlicher sucht in einer Kirche Schutz vor dem draußen tobenden Sturm. Sie leben dort teilweise schon seit langer Zeit, abgeschottet von der Außenwelt. Als Neuankömmling Lila dazustößt, wird die Gruppendynamik aufgewirbelt ... Dieses neue, etwa 110-minütige Musical erzählt eine bewegende Geschichte über Akzeptanz und Gemeinschaft und verarbeitet dabei Themen wie Queerness, Identität, Freundschaft und Heimat. Uraufführung 2026 im Kulturforum Fürth.","dateCreated":"2026","award":["Nominierung Deutscher Musical Theater Preis 2026 – Beste Komposition","Nominierung Deutscher Musical Theater Preis 2026 – Beste Liedtexte"],"sameAs":["https://www.musikundbuehne.de/skk/im-auge-des-sturms.html"]},{"@type":"MusicAlbum","name":"Im Auge des Sturms (Cast Recording)","albumProductionType":"https://schema.org/SoundtrackAlbum","byArtist":{"@id":"https://nicschilling.de/#person"},"sameAs":["https://open.spotify.com/album/1sAzjwgXnLtIYEz0Cketgs"]},{"@type":"MusicComposition","name":"Laika","genre":"Musical","inLanguage":"de","url":"https://nicschilling.de/musical","composer":{"@id":"https://nicschilling.de/#person"},"lyricist":{"@id":"https://nicschilling.de/#person"},"dateCreated":"2014","description":"Laika ist anders als ihre Mitschülerinnen. Sie hört Musik, egal wohin sie geht. Wenn ihre Klasse und auch ihr Lehrer anfangen, sie dafür auszugrenzen, überschlagen sich die Ereignisse. Das Musical behandelt Themen wie Mobbing, Ausgrenzung und Diversität. Es wurde bereits mehrfach aufgeführt. Aufgrund seiner thematischen Relevanz, flexiblen Besetzung und einfacher Ausstattung ist das Stück besonders gut für Schulen geeignet."}]}</script></head><body><noscript>You need to enable JavaScript to run this app.</noscript><div id="root"></div></body></html>
